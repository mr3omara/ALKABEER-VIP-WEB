version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alkabeer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alkabeer_db
      POSTGRES_USER: alkabeer_user
      POSTGRES_PASSWORD: alkabeer_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alkabeer_user -d alkabeer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
